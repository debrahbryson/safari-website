services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: safari
      POSTGRES_PASSWORD: safari_pass
      POSTGRES_DB: safari_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safari -d safari_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://safari:safari_pass@db:5432/safari_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
